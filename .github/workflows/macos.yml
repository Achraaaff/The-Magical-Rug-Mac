name: Build Mac installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example v1.0.0)
        required: true
        default: v1.0.0
permissions:
  contents: write
concurrency:
  group: macos-installer
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select toolchain and record target
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          fi
          sw_vers
          uname -m
          xcodebuild -version
      - name: Verify physics provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          origin=json.loads((root/'UPSTREAM.json').read_text())
          assert hashlib.sha256((root/'Sources/Physics/cloth.hpp').read_bytes()).hexdigest()==origin['physics_sha256']
          PY
      - name: Check portable interactions on Intel
        run: ./scripts/test-core.sh
      - name: Build universal native app and shaders
        run: ./scripts/build-macos.sh
      - name: Validate bundle
        run: |
          test -s 'build/The Magical Rug.app/Contents/Resources/Rug.metallib'
          test -s 'build/The Magical Rug.app/Contents/Resources/persian.jpg'
          test -s 'build/The Magical Rug.app/Contents/Resources/INSTALL.html'
          codesign --verify --deep --strict 'build/The Magical Rug.app'
          xcrun lipo 'build/The Magical Rug.app/Contents/MacOS/MagicalRug' -verify_arch x86_64 arm64
          otool -L 'build/The Magical Rug.app/Contents/MacOS/MagicalRug'
      - name: Package drag-to-Applications download
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: The-Magical-Rug-Mac-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish private download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version such as v1.0.0'; exit 1; }
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "The Magical Rug for Mac ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md
